<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMP-INTEL 360</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ink:#0F1B2D; --ink2:#16263D; --paper:#F3F0E8; --paper2:#EAE5D8;
  --line: #D8D1BE; --gold:#B8873A; --gold-l:#E4C079; --rust:#A8462F;
  --sage:#5E7461; --slate:#5B6472; --white:#FFFFFF;
  --font-display:'Source Serif Pro','Georgia',serif;
  --font-body:'Inter',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',monospace;
}
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:var(--font-body); background:var(--paper); color:var(--ink); font-size:14px; line-height:1.5;}
::selection{background:var(--gold-l);}
button{font-family:inherit; cursor:pointer;}
input, select, textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

/* ===== MASTHEAD ===== */
.masthead{background:var(--ink); color:var(--paper); padding:18px 28px 0; position:sticky; top:0; z-index:50;}
.masthead-top{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px 20px; padding-bottom:14px; border-bottom:1px solid rgba(243,240,232,0.15);}
.brand{display:flex; align-items:baseline; gap:12px;}
.brand-mark{font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:0.5px;}
.brand-mark em{color:var(--gold-l); font-style:normal;}
.brand-sub{font-family:var(--font-mono); font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#9AA6B8; padding-left:12px; border-left:1px solid rgba(243,240,232,0.25);}
.masthead-meta{font-family:var(--font-mono); font-size:11px; color:#8C97A8; display:flex; gap:18px; align-items:center;}
.masthead-meta .dot{width:6px; height:6px; border-radius:50%; background:var(--sage); display:inline-block; margin-right:6px; box-shadow:0 0 6px var(--sage);}

.docbar{display:flex; align-items:center; gap:10px; padding:12px 0; flex-wrap:wrap;}
.docbar-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:#8C97A8; margin-right:4px;}
.doc-chip{display:flex; align-items:center; gap:7px; background:rgba(243,240,232,0.06); border:1px solid rgba(243,240,232,0.18); border-radius:20px; padding:6px 13px 6px 10px; font-size:12.5px; cursor:pointer; transition:all .15s;}
.doc-chip:hover{border-color:rgba(243,240,232,0.4);}
.doc-chip.active{background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600;}
.doc-chip .ck{width:14px; height:14px; border-radius:3px; border:1.5px solid #8C97A8; display:flex; align-items:center; justify-content:center; font-size:10px;}
.doc-chip.active .ck{background:var(--ink); border-color:var(--ink); color:var(--gold-l);}
.doc-chip .badge{font-family:var(--font-mono); font-size:9.5px; opacity:0.7;}
.docbar-actions{margin-left:auto; display:flex; gap:8px;}
.btn-ghost{background:transparent; border:1px solid rgba(243,240,232,0.25); color:var(--paper); padding:6px 12px; border-radius:6px; font-size:12px; font-weight:500;}
.btn-ghost:hover{border-color:var(--gold-l); color:var(--gold-l);}

/* ===== NAV ===== */
.tabnav{display:flex; gap:2px; padding:0 28px; background:var(--ink2); overflow-x:auto;}
.tab-btn{font-family:var(--font-body); font-size:12.5px; font-weight:600; letter-spacing:0.2px; color:#9AA6B8; background:transparent; border:none; padding:12px 16px; white-space:nowrap; border-bottom:2px solid transparent; display:flex; align-items:center; gap:7px;}
.tab-btn .n{font-family:var(--font-mono); font-size:10px; opacity:0.6;}
.tab-btn:hover{color:var(--paper);}
.tab-btn.active{color:var(--gold-l); border-bottom-color:var(--gold);}

/* ===== LAYOUT ===== */
.wrap{max-width:1440px; margin:0 auto; padding:26px 28px 60px;}
.view{display:none;}
.view.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px;}
.section-title{font-family:var(--font-display); font-size:22px; font-weight:600;}
.section-desc{font-size:12.5px; color:var(--slate); max-width:640px;}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px; color:var(--rust); font-weight:600; margin-bottom:4px; display:block;}

.card{background:var(--white); border:1px solid var(--line); border-radius:10px; padding:18px;}
.grid{display:grid; gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr;}}

/* KPI cards */
.kpi{cursor:pointer; transition:transform .15s, box-shadow .15s; position:relative; overflow:hidden;}
.kpi:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(15,27,45,0.08); border-color:var(--gold);}
.kpi::before{content:''; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--gold);}
.kpi-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--slate); display:flex; justify-content:space-between; align-items:center;}
.kpi-val{font-family:var(--font-display); font-size:34px; font-weight:700; margin:6px 0 4px; color:var(--ink);}
.kpi-delta{font-size:11.5px; color:var(--sage); font-weight:600;}
.kpi-delta.down{color:var(--rust);}
.kpi-foot{font-size:11px; color:var(--slate); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
.kpi-a{cursor:default;}
.kpi-a::before{background:var(--rust);}
.kpi-a .kpi-label{margin-bottom:8px;}
.kpi-mini-list{display:flex; flex-direction:column; gap:2px;}
.kpi-mini-row{display:flex; align-items:center; gap:8px; padding:6px 4px; border-radius:6px; cursor:pointer; font-size:12.5px;}
.kpi-mini-row:hover{background:var(--paper);}
.kpi-mini-rank{font-family:var(--font-mono); font-size:10px; color:var(--gold); font-weight:700; width:12px;}
.kpi-mini-name{flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.kpi-mini-count{font-family:var(--font-mono); font-size:11px; color:var(--slate);}
.kpi-mini-empty{font-size:12px; color:var(--slate); padding:8px 4px;}
.profile-body-wrap{padding:16px 18px; display:none;}
.profile-body-wrap.open{display:block;}
.profile-subtabs{display:flex; gap:2px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:14px;}
.psub-btn{padding:7px 12px; font-size:11.5px; font-weight:600; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--slate); white-space:nowrap;}
.psub-btn:hover{color:var(--ink);}
.psub-btn.active{color:var(--rust); border-bottom-color:var(--rust);}
.mchip.clickable{cursor:pointer; transition:all .12s;}
.mchip.clickable:hover{background:var(--gold-l); color:var(--ink);}

.card-title{font-weight:700; font-size:13.5px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
.card-title .hint{font-weight:400; font-size:11px; color:var(--slate); font-family:var(--font-mono);}

/* clickable rows / list items */
.rowlist{display:flex; flex-direction:column; gap:0;}
.rowlist .ri{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--paper2); cursor:pointer; font-size:12.8px;}
.rowlist .ri:hover{background:var(--paper);}
.rowlist .ri:last-child{border-bottom:none;}
.tag{font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; padding:2px 7px; border-radius:10px; font-weight:700; white-space:nowrap;}
.tag.blog{background:#E7EEF7; color:#2E5C8A;}
.tag.news{background:#FBEAE3; color:var(--rust);}
.tag.product{background:#E9F0E9; color:var(--sage);}
.tag.event-past{background:#F1EDE0; color:#8A7534;}
.tag.event-upcoming{background:#F4E4C9; color:#8A5A0F;}
.tag.partnership{background:#EFE4F4; color:#6A3E8A;}
.ri-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ri-date{font-family:var(--font-mono); font-size:10.5px; color:var(--slate); white-space:nowrap;}
.ri-vendor{font-weight:600; font-size:11px; color:var(--ink); white-space:nowrap;}

/* pills / bars */
.barrow{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12px;}
.barrow .bl{width:110px; flex-shrink:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.barrow .bt{flex:1; height:9px; background:var(--paper2); border-radius:5px; overflow:hidden;}
.barrow .bt > div{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-l)); border-radius:5px;}
.barrow .bv{width:28px; text-align:right; font-family:var(--font-mono); font-size:11px; color:var(--slate);}

/* filters */
.filterbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.filterbar select, .filterbar input[type=text]{padding:8px 12px; border:1px solid var(--line); border-radius:7px; background:var(--white); font-size:12.5px; color:var(--ink);}
.filterbar label{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--slate); margin-right:-4px;}

/* subtabs */
.subtabs{display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line);}
.subtab-btn{padding:9px 16px; font-size:12.5px; font-weight:600; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--slate);}
.subtab-btn.active{color:var(--rust); border-bottom-color:var(--rust);}
.subview{display:none;} .subview.active{display:block;}

/* competitor profile cards */
.profile-card{background:var(--white); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:14px;}
.profile-head{background:var(--ink); color:var(--paper); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.profile-head-l{display:flex; align-items:center; gap:12px;}
.profile-name{font-family:var(--font-display); font-size:17px; font-weight:700;}
.profile-stats{font-family:var(--font-mono); font-size:10.5px; color:#9AA6B8; display:flex; gap:14px;}
.profile-body{padding:16px 18px; display:none;}
.profile-body.open{display:grid; grid-template-columns:1.3fr 1fr; gap:20px;}
@media(max-width:900px){.profile-body.open{grid-template-columns:1fr;}}
.chev{transition:transform .2s; color:var(--gold-l);}
.chev.open{transform:rotate(90deg);}
.mini-h{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--rust); font-weight:700; margin:14px 0 6px;}
.mini-h:first-child{margin-top:0;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.mchip{background:var(--paper2); border-radius:5px; padding:3px 9px; font-size:11px; font-weight:600;}

/* feature matrix table */
.matrix-table{width:100%; border-collapse:collapse; font-size:12px;}
.matrix-table th, .matrix-table td{border:1px solid var(--line); padding:8px 10px; text-align:center;}
.matrix-table th{background:var(--ink); color:var(--paper); font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.5px; font-weight:600;}
.matrix-table td:first-child, .matrix-table th:first-child{text-align:left; font-weight:700; position:sticky; left:0; background:var(--paper2); z-index:1;}
.matrix-table th:first-child{background:var(--ink);}
.mtick{color:var(--sage); font-size:15px; font-weight:900;}
.mdash{color:var(--line);}
.mnote{font-size:11px; color:var(--slate); margin-top:10px; font-style:italic;}

/* Ingest */
.dropzone{border:2px dashed var(--line); border-radius:10px; padding:34px; text-align:center; background:var(--white); transition:all .15s; cursor:pointer;}
.dropzone.drag{border-color:var(--gold); background:#FBF6EC;}
.dropzone strong{font-family:var(--font-display); font-size:16px;}
.doctable{width:100%; border-collapse:collapse; margin-top:16px; font-size:12.5px;}
.doctable th{text-align:left; font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--slate); padding:8px 10px; border-bottom:2px solid var(--ink);}
.doctable td{padding:10px; border-bottom:1px solid var(--paper2); vertical-align:middle;}
.status-pill{font-family:var(--font-mono); font-size:10px; padding:3px 9px; border-radius:10px; font-weight:700;}
.status-pill.ready{background:#E9F0E9; color:var(--sage);}
.status-pill.processing{background:#F4E4C9; color:#8A5A0F;}
.status-pill.error{background:#FBEAE3; color:var(--rust);}
.log-line{font-family:var(--font-mono); font-size:11px; color:var(--slate); padding:3px 0; border-bottom:1px dotted var(--paper2);}

/* Chat */
.chat-wrap{display:grid; grid-template-columns:1fr 280px; gap:20px;}
@media(max-width:900px){.chat-wrap{grid-template-columns:1fr;}}
.chat-log{background:var(--white); border:1px solid var(--line); border-radius:10px; height:560px; display:flex; flex-direction:column;}
.chat-msgs{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px;}
.msg{max-width:82%; padding:11px 14px; border-radius:10px; font-size:13px; line-height:1.55;}
.msg.user{align-self:flex-end; background:var(--ink); color:var(--paper);}
.msg.bot{align-self:flex-start; background:var(--paper); border:1px solid var(--line);}
.msg.bot strong{color:var(--rust);}
.msg ul, .msg ol {padding-left:18px; margin-top:4px;}
.chat-input-row{border-top:1px solid var(--line); padding:12px; display:flex; gap:8px;}
.chat-input-row input{flex:1; border:1px solid var(--line); border-radius:7px; padding:10px 12px; font-size:13px;}
.btn-send{background:var(--rust); color:white; border:none; padding:0 18px; border-radius:7px; font-weight:700; font-size:12.5px;}
.btn-send:disabled{opacity:0.5; cursor:not-allowed;}
.suggest-chip{display:block; width:100%; text-align:left; background:var(--white); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:11.8px; margin-bottom:8px; color:var(--ink);}
.suggest-chip:hover{border-color:var(--gold); background:#FBF6EC;}

/* modal */
.modal-bg{position:fixed; inset:0; background:rgba(15,27,45,0.55); display:none; align-items:flex-start; justify-content:center; z-index:200; padding:60px 20px; overflow-y:auto;}
.modal-bg.open{display:flex;}
.modal{background:var(--white); border-radius:12px; max-width:640px; width:100%; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.modal-head{background:var(--ink); color:var(--paper); padding:18px 22px; display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
.modal-head h3{font-family:var(--font-display); font-size:18px; line-height:1.35;}
.modal-close{background:transparent; border:none; color:#9AA6B8; font-size:20px; line-height:1;}
.modal-body{padding:22px;}
.modal-meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.modal-source{margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); font-size:12px; color:var(--slate);}
.modal-source b{color:var(--ink);}

.empty{text-align:center; padding:40px 20px; color:var(--slate); font-size:13px;}
.spark{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* access gate */
.gate-bg{position:fixed; inset:0; background:var(--ink); display:none; align-items:center; justify-content:center; z-index:500; padding:20px;}
.gate-bg.open{display:flex;}
.gate-box{background:var(--paper); border-radius:14px; max-width:460px; width:100%; padding:34px 32px; box-shadow:0 30px 80px rgba(0,0,0,0.5);}
.gate-box h2{font-family:var(--font-display); font-size:24px; margin-bottom:10px;}
.gate-box p{font-size:13.5px; color:var(--slate); line-height:1.6; margin-bottom:16px;}
.gate-box input{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-bottom:10px;}
.gate-box .btn-primary{width:100%; background:var(--rust); color:#fff; border:none; padding:12px; border-radius:8px; font-weight:700; font-size:13.5px;}
.gate-box .btn-primary:hover{background:#8f3a26;}
.gate-box .gate-alt{font-size:11.5px; color:var(--slate); text-align:center; margin-top:14px;}
.gate-box .gate-alt a{color:var(--gold); cursor:pointer; font-weight:600;}
.gate-spinner{width:22px; height:22px; border:3px solid var(--paper2); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.owner-badge{font-family:var(--font-mono); font-size:10px; background:var(--gold); color:var(--ink); padding:2px 8px; border-radius:10px; font-weight:700; cursor:pointer;}
.viewer-badge{font-family:var(--font-mono); font-size:10px; background:rgba(243,240,232,0.1); color:#9AA6B8; padding:2px 8px; border-radius:10px; cursor:pointer;}
.req-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--paper2); font-size:12.5px;}
.req-row .rn{font-weight:700; flex:1;}
.req-row .rt{font-family:var(--font-mono); font-size:10.5px; color:var(--slate);}
.btn-approve{background:var(--sage); color:#fff; border:none; padding:5px 12px; border-radius:6px; font-size:11px; font-weight:700;}
.btn-deny{background:transparent; border:1px solid var(--rust); color:var(--rust); padding:5px 12px; border-radius:6px; font-size:11px; font-weight:700;}
.pending-badge{background:var(--rust); color:#fff; font-family:var(--font-mono); font-size:9.5px; border-radius:9px; padding:1px 6px; margin-left:6px;}
.locked-note{background:#FBF6EC; border:1px dashed var(--gold); border-radius:8px; padding:14px 16px; font-size:12.5px; color:var(--slate);}
</style>
</head>
<body>

<div class="gate-bg" id="gateBg">
  <div class="gate-box" id="gateBox"></div>
</div>

<div class="masthead">
  <div class="masthead-top">
    <div class="brand">
      <div class="brand-mark">COMP-INTEL <em>360</em></div>
      <div class="brand-sub">Scalefusion &middot; Market Research</div>
    </div>
    <div class="masthead-meta">
      <span id="syncMeta"><span class="dot"></span>Live</span>
      <span id="docCountMeta">— documents loaded</span>
      <button class="btn-ghost" style="padding:4px 10px; font-size:11px;" onclick="manualRefresh()">↻ Refresh</button>
      <span id="ownerMeta"></span>
      <span id="clockMeta"></span>
    </div>
  </div>
  <div class="docbar" id="docbar">
    <span class="docbar-label">Active documents <span class="hint" style="font-family:var(--font-body); text-transform:none; letter-spacing:0;">— your own selection, others see their own</span></span>
    <!-- chips injected -->
    <div class="docbar-actions">
      <button class="btn-ghost" onclick="selectAllDocs()">Select all</button>
      <button class="btn-ghost" id="uploadNavBtn" onclick="gotoTab('ingest')">+ Upload newsletter</button>
    </div>
  </div>
</div>

<div class="tabnav" id="tabnav"></div>

<div class="wrap">
  <div class="view" id="view-exec"></div>
  <div class="view" id="view-matrix"></div>
  <div class="view" id="view-profiles"></div>
  <div class="view" id="view-marketing"></div>
  <div class="view" id="view-events"></div>
  <div class="view" id="view-oem"></div>
  <div class="view" id="view-partners"></div>
  <div class="view" id="view-ingest"></div>
  <div class="view" id="view-chat"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalEl"></div>
</div>

<script>
// ============================================================
// SEED DATA — transcribed from the three uploaded newsletters
// ============================================================
const SEED_DOCS = [
{
  id: "2026-04", label: "April 2026", month: "Apr", year: 2026, uploadedAt: "2026-04-30", builtin: true,
  vendors: [
    { name:"42Gears", items:[

<script>

   ============================================================ */
let ALL_DOCS = [...SEED_DOCS];
let selectedDocIds = new Set(ALL_DOCS.map(d=>d.id));
let activeTab = 'exec';
let profileOpen = {};
let profileSubTab = {};
let chatHistory = [];
let ingestLog = [];

let isOwner = false;
let lastSyncedAt = null;
let pollHandle = null;
let ACCESS_REQUESTS = [];

const TAB_DEFS = [
  {id:'exec', label:'Executive Dashboard'},
  {id:'matrix', label:'Features & Matrix'},
  {id:'profiles', label:'Competitor Profiles'},
  {id:'marketing', label:'Marketing Analysis'},
  {id:'events', label:'Events'},
  {id:'oem', label:'OEM Analysis'},
  {id:'partners', label:'Partner Updates'},
  {id:'ingest', label:'Ingest Documents'},
  {id:'chat', label:'Ask Sentry'},
];

const TYPE_LABEL = {blog:'Blog', news:'News', product:'Product', 'event-past':'Event · Past', 'event-upcoming':'Event · Upcoming', partnership:'Partnership'};

const OEM_HINTS = ['zebra','tsc','asus','sato','hid','google','microsoft','apple','sap','samsung','nvidia','honeywell','okta','1password','microsoft entra id','microsoft intune','microsoft azure','cisco','red hat','pax8','datto','carahsoft','silverfort','nametag','workbrew','quokka','nenasal','bitsummit','halopsa','breez','zones india','sphero','google cloud','google workspace'];

const CATEGORY_RULES = [
  {name:'AI & Agentic Security', kw:['ai ','artificial intelligence','agent','agentic','mcp','llm','copilot']},
  {name:'Identity & Access (IAM/SSO)', kw:['sso','iam','identity','passkey','passwordless','mfa','saml','oauth','pam','sspr','fido']},
  {name:'Zero Trust & Security', kw:['zero trust','xdr','edr','threat','breach','malware','vulnerab','ransomware','soc','siem']},
  {name:'Compliance & Regulatory', kw:['compliance','dpdp','gdpr','dora','popia','hipaa','iso 27001','regulat']},
  {name:'Kiosk & Rugged Devices', kw:['kiosk','rugged','printer','zebra','digital signage','device farm']},
  {name:'Mac / Apple Management', kw:['mac ','macos','apple','ios','ipados','declarative device']},
  {name:'MSP & Channel', kw:['msp ','managed service','channel','partner','reseller','rmm']},
  {name:'Patch & Vulnerability Mgmt', kw:['patch','vulnerab','cve','remediat']},
  {name:'Competitive Positioning', kw:['alternative','vs ','comparison','deep dive','breakdown']},
  {name:'Android & Mobile Mgmt', kw:['android','mobile device','emm ','byod']},
  {name:'Integrations & APIs', kw:['integrat','api ','webhook','sdk']},
  {name:'Platform / OS Support', kw:['windows','macos','linux','ubuntu','ios ','ipados']},
  {name:'Bug Fixes & Reliability', kw:['fix','bug','improv','enhanc','reliab','stabil']},
];

function categorize(title, extra){
  const t = ((title||'')+' '+(extra||'')).toLowerCase();
  for(const rule of CATEGORY_RULES){ if(rule.kw.some(k=>t.includes(k))) return rule.name; }
  return 'General / Other';
}
function isOEM(partner){
  if(!partner) return false;
  const p = partner.toLowerCase();
  return OEM_HINTS.some(h=>p.includes(h));
}

/* ============================================================
   DATA HELPERS
   ============================================================ */
function selectedDocs(){ return ALL_DOCS.filter(d=>selectedDocIds.has(d.id)); }
function allItems(){
  const out = [];
  for(const doc of selectedDocs()){
    for(const v of doc.vendors){
      for(const it of v.items){
        out.push({...it, vendor:v.name, docId:doc.id, docLabel:doc.label});
      }
    }
  }
  return out;
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'});
}
function vendorList(items){ return [...new Set(items.map(i=>i.vendor))].sort(); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function escq(s){ return String(s).replace(/'/g,"\\'"); }

/* click-action registry — avoids fragile string-escaping when wiring dynamic onclick handlers */
let ACTIONS = {};
function registerAction(fn){ const id = 'a'+uid(); ACTIONS[id] = fn; return id; }
function runAction(id){ if(ACTIONS[id]) ACTIONS[id](); }

/* our own brands — used to flag any competitor content that names us directly */
const OUR_BRANDS = ['Scalefusion','Veltar','OneIdP'];
function findBrandMentions(items){
  const out = [];
  items.forEach(i=>{
    const hay = ((i.t||'')+' '+(i.s||'')).toLowerCase();
    OUR_BRANDS.forEach(b=>{ if(hay.includes(b.toLowerCase())) out.push({...i, matchedBrand:b}); });
  });
  return out;
}
const NEWS_CATEGORY_RULES = [
  {name:'Recognition & Awards', kw:['award','recogni','named','wins','win a','best software','magic quadrant','leadership compass','marketscape','g2 ']},
  {name:'Funding & M&A', kw:['acqui','million','billion','funding','invest','ipo',' arr','revenue']},
  {name:'Partnership & Integration', kw:['partner','integrat','collab']},
  {name:'Expansion & Launch', kw:['launch','expand','data center','availab','introduc']},
];
function categorizeNews(title){
  const t = title.toLowerCase();
  for(const r of NEWS_CATEGORY_RULES){ if(r.kw.some(k=>t.includes(k))) return r.name; }
  return 'Other News';
}
function topEntries(items, keyFn, n){
  const counts = {};
  items.forEach(i=>{ const k = keyFn(i); if(!k) return; counts[k] = (counts[k]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return n===undefined ? sorted : sorted.slice(0,n);
}

/* ============================================================
   NAV / DOCBAR RENDER
   ============================================================ */
function renderTabNav(){
  const nav = document.getElementById('tabnav');
  const defs = TAB_DEFS.filter(t=> t.id!=='ingest' || isOwner);
  nav.innerHTML = defs.map(t=>`<button class="tab-btn ${activeTab===t.id?'active':''}" onclick="gotoTab('${t.id}')">${t.label}${t.id==='ingest'?pendingBadgeHTML():''}</button>`).join('');
}
function pendingBadgeHTML(){
  if(!isOwner || !ACCESS_REQUESTS) return '';
  const n = ACCESS_REQUESTS.filter(r=>r.status==='pending').length;
  return n>0 ? `<span class="pending-badge">${n}</span>` : '';
}
function gotoTab(id){
  if(id==='ingest' && !isOwner) return;
  activeTab = id;
  renderTabNav();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  renderActiveView();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderDocbar(){
  const bar = document.getElementById('docbar');
  const chips = ALL_DOCS.map(d=>{
    const active = selectedDocIds.has(d.id);
    const itemCount = d.vendors.reduce((a,v)=>a+v.items.length,0);
    return `<div class="doc-chip ${active?'active':''}" onclick="toggleDoc('${d.id}')">
      <span class="ck">${active?'✓':''}</span>
      <span>${d.label}</span>
      <span class="badge">${itemCount} items${d.builtin?'':' · uploaded'}</span>
    </div>`;
  }).join('');
  bar.innerHTML = `<span class="docbar-label">Active documents <span class="hint" style="font-family:var(--font-body); text-transform:none; letter-spacing:0;">— your own selection, others see their own</span></span>` + chips +
    `<div class="docbar-actions">
      <button class="btn-ghost" onclick="selectAllDocs()">Select all</button>
      ${isOwner?`<button class="btn-ghost" id="uploadNavBtn" onclick="gotoTab('ingest')">+ Upload newsletter</button>`:''}
    </div>`;
  document.getElementById('docCountMeta').textContent = `${selectedDocIds.size} of ${ALL_DOCS.length} documents selected`;
}
function toggleDoc(id){
  if(selectedDocIds.has(id)) selectedDocIds.delete(id); else selectedDocIds.add(id);
  if(selectedDocIds.size===0) selectedDocIds.add(id);
  renderDocbar(); renderActiveView();
  saveMySelection();
}
function selectAllDocs(){ selectedDocIds = new Set(ALL_DOCS.map(d=>d.id)); renderDocbar(); renderActiveView(); saveMySelection(); }
async function saveMySelection(){
  try{ await window.storage.set('my-doc-selection', JSON.stringify([...selectedDocIds]), false); }catch(e){ /* best effort */ }
}

function renderActiveView(){
  ({
    exec: renderExec, matrix: renderMatrix, profiles: renderProfiles,
    marketing: renderMarketing, events: renderEvents, oem: renderOEM,
    partners: renderPartners, ingest: renderIngest, chat: renderChat
  })[activeTab]?.();
}

/* ============================================================
   1. EXECUTIVE DASHBOARD
   ============================================================ */
function renderExec(){
  const items = allItems();
  const el = document.getElementById('view-exec');
  if(items.length===0){ el.innerHTML = emptyState('Select at least one document to populate the dashboard.'); return; }

  const byVendor = {};
  items.forEach(i=>{ byVendor[i.vendor] = byVendor[i.vendor] || []; byVendor[i.vendor].push(i); });
  const blogs = items.filter(i=>i.ty==='blog');
  const news = items.filter(i=>i.ty==='news');
  const productUpdates = items.filter(i=>i.ty==='product');
  const events = items.filter(i=>i.ty.startsWith('event'));
  const partnerships = items.filter(i=>i.ty==='partnership' || i.partner);
  const oemMoves = items.filter(i=>i.partner && isOEM(i.partner));
  const competitiveMentions = items.filter(i=>i.competitive);
  const brandHits = findBrandMentions(items);

  // ---- analytical rankings behind each KPI ----
  const rActive = topEntries(items, i=>i.vendor, 3);
  const rThemes = topEntries(blogs.concat(news), i=>i.category||categorize(i.t), 3);
  const rProductTrends = topEntries(productUpdates, i=>i.category||categorize(i.t, i.s), 3);
  const rHotspots = topEntries(events, i=>i.region||'Global/Unspecified', 3);
  const rOem = topEntries(oemMoves, i=>i.partner, 3);
  const rCompetitive = topEntries(competitiveMentions, i=>`${i.vendor} → ${i.competitive}`, 3);
  const rNews = topEntries(news, i=>categorizeNews(i.t), 3);
  const rBrandByVendor = topEntries(brandHits, i=>i.vendor, 3);

  el.innerHTML = `
    <div class="section-head">
      <div><span class="eyebrow">Situation Room</span><div class="section-title">Executive Dashboard</div>
      <div class="section-desc">Aggregated across ${selectedDocIds.size} selected newsletter${selectedDocIds.size>1?'s':''} · ${vendorList(items).length} vendors tracked · click any row for the underlying documents.</div></div>
    </div>
    <div class="grid g4" style="margin-bottom:20px;" id="execKpiRow1"></div>
    <div class="grid g4" style="margin-bottom:20px;" id="execKpiRow2"></div>
    <div class="grid g2" style="margin-bottom:20px;">
      <div class="card">
        <div class="card-title">Activity by competitor <span class="hint">click a bar for the vendor's full feed</span></div>
        <div id="execVendorBars"></div>
      </div>
      <div class="card">
        <div class="card-title">Content mix <span class="hint">blogs · news · product · events · partnerships</span></div>
        <canvas id="execMixChart" height="200"></canvas>
      </div>
    </div>
    <div class="grid g2">
      <div class="card">
        <div class="card-title">Latest moves <span class="hint">most recent across selected docs</span></div>
        <div class="rowlist" id="execLatest"></div>
      </div>
      <div class="card">
        <div class="card-title">Direct competitive callouts <span class="hint">vendors naming a competitor</span></div>
        <div class="rowlist" id="execCompetitive"></div>
      </div>
    </div>
  `;

  // ---- KPI row 1 ----
  document.getElementById('execKpiRow1').innerHTML = [
    kpiListCard('Most active competitors', rActive, name=>openVendorDetail(name), `${vendorList(items).length} vendors tracked total`),

      <span class="kpi-mini-rank">${idx+1}</span>

      <span class="kpi-mini-count">${count}</span>
    </div>`;
  }).join('') || `<div class="kpi-mini-empty">No data for this selection</div>`;
  return `<div class="card kpi-a">
    <div class="kpi-label">${label}</div>
    <div class="kpi-mini-list">${rows}</div>
    ${footNote?`<div class="kpi-foot">${footNote}</div>`:''}

}
function rowItem(i){

function openExecDetail(filterType, filterVal){

function renderQuadChart(){
  const items = allItems();
  const byVendor = {};
  items.forEach(i=>{ byVendor[i.vendor] = byVendor[i.vendor] || []; byVendor[i.vendor].push(i); });
  const pts = Object.entries(byVendor).map(([v,arr])=>{
    const x = arr.filter(i=>['blog','news','event-past','event-upcoming'].includes(i.ty)).length;
    const y = arr.filter(i=>i.ty==='product').length;
    return {v, x, y, r: Math.max(6, Math.min(26, arr.length*0.9))};
  });
  const canvas = document.getElementById('quadChart');
  if(!canvas) return;
  const colors = ['#A8462F','#2E5C8A','#5E7461','#8A5A0F','#6A3E8A','#B8873A','#3E7C8A','#8A3E5A','#4A8A3E','#8A4A3E'];
  new Chart(canvas, {

    data:{ datasets: pts.map((p,idx)=>({ label:p.v, data:[{x:p.x,y:p.y,r:p.r}], backgroundColor: colors[idx%colors.length]+'CC', borderColor: colors[idx%colors.length], borderWidth:1.5 })) },
    options:{
      plugins:{ legend:{position:'right', labels:{boxWidth:10,font:{size:11}}},
        tooltip:{callbacks:{label:(ctx)=>`${ctx.dataset.label}: ${ctx.raw.x} marketing moves, ${ctx.raw.y} product releases`}} },

      onClick:(evt,els)=>{ if(els.length){ const idx=els[0].datasetIndex; openQuadrantDetail(pts[idx].v); } }
    }

function quadrantPositionLabel(x, y, allItemsArr){
  const byVendor = {};
  allItemsArr.forEach(i=>{ byVendor[i.vendor] = byVendor[i.vendor] || []; byVendor[i.vendor].push(i); });
  const pts = Object.values(byVendor).map(arr=>({
    x: arr.filter(i=>['blog','news','event-past','event-upcoming'].includes(i.ty)).length,
    y: arr.filter(i=>i.ty==='product').length
  }));
  const xs = pts.map(p=>p.x).sort((a,b)=>a-b);
  const ys = pts.map(p=>p.y).sort((a,b)=>a-b);
  const medX = xs[Math.floor(xs.length/2)] || 0;
  const medY = ys[Math.floor(ys.length/2)] || 0;
  const highX = x>=medX, highY = y>=medY;
  if(highX && highY) return 'the high-marketing / high-product-development quadrant';
  if(highX && !highY) return 'the high-marketing / lower-product-development quadrant';
  if(!highX && highY) return 'the lower-marketing / high-product-development quadrant';
  return 'the lower-marketing / lower-product-development quadrant';
}

function renderProfileSub(v, vi, sub, brandHits){
  if(sub==='overview'){
    const bn = vi.filter(i=>i.ty==='blog'||i.ty==='news');
    const cats = {}; bn.forEach(b=>{ const c=b.category||categorize(b.t); cats[c]=(cats[c]||0)+1; });
    const topCats = Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const regions = [...new Set(vi.filter(i=>i.region).map(i=>i.region))];
    const partners = [...new Set(vi.filter(i=>i.partner).map(i=>i.partner))];
    const prodCount = vi.filter(i=>i.ty==='product').length;
    const evCount = vi.filter(i=>i.ty.startsWith('event')).length;
    const narrative = topCats.length
      ? `${v} concentrated its public messaging on <b>${topCats[0][0]}</b> this period (${topCats[0][1]} piece${topCats[0][1]===1?'':'s'}), alongside ${prodCount} product update${prodCount===1?'':'s'} and ${evCount} event${evCount===1?'':'s'} across ${regions.length} named region${regions.length===1?'':'s'}.`
      : `No blog or news content logged for ${v} in the selected documents.`;
    return `<div class="grid g2">
      <div>
        <div class="mini-h">Snapshot</div>
        <p style="font-size:13px; line-height:1.6;">${narrative}</p>
        <div class="mini-h">Top focus areas</div>
        <div class="chip-row">${topCats.length? topCats.map(([c,n])=>`<span class="mchip">${c} · ${n}</span>`).join(''):'<span class="mchip">—</span>'}</div>
      </div>
      <div>
        <div class="mini-h">At a glance</div>
        <div class="rowlist">
          <div class="ri"><span class="ri-title">Blogs / News</span><span class="ri-date">${vi.filter(i=>i.ty==='blog').length} / ${vi.filter(i=>i.ty==='news').length}</span></div>
          <div class="ri"><span class="ri-title">Product releases</span><span class="ri-date">${prodCount}</span></div>
          <div class="ri"><span class="ri-title">Events (past / upcoming)</span><span class="ri-date">${vi.filter(i=>i.ty==='event-past').length} / ${vi.filter(i=>i.ty==='event-upcoming').length}</span></div>
          <div class="ri"><span class="ri-title">Partnerships logged</span><span class="ri-date">${partners.length}</span></div>
        </div>
      </div>
    </div>`;
  }
  if(sub==='moves'){
    return `<div class="rowlist">${vi.slice().sort((a,b)=>new Date(b.d)-new Date(a.d)).map(rowItem).join('') || emptyRow()}</div>`;
  }
  if(sub==='events'){
    const regions = [...new Set(vi.filter(i=>i.region).map(i=>i.region))];
    const ev = vi.filter(i=>i.ty.startsWith('event'));
    return `<div class="mini-h">Regions active</div>
      <div class="chip-row" style="margin-bottom:16px;">${regions.length? regions.map(r=>`<span class="mchip">${r}</span>`).join(''):'<span class="mchip">None logged</span>'}</div>
      <div class="mini-h">Event log</div>
      <div class="rowlist">${ev.slice().sort((a,b)=>new Date(a.d)-new Date(b.d)).map(rowItem).join('') || emptyRow('No events logged.')}</div>`;
  }
  if(sub==='oem'){
    const part = vi.filter(i=>i.ty==='partnership'||i.partner);
    const oems = [...new Set(part.filter(p=>isOEM(p.partner)).map(p=>p.partner))];
    return `<div class="mini-h">OEM / tech partners named</div>
      <div class="chip-row" style="margin-bottom:16px;">${oems.length? oems.map(o=>`<span class="mchip">${o}</span>`).join(''):'<span class="mchip">None logged</span>'}</div>
      <div class="mini-h">Partnership log</div>
      <div class="rowlist">${part.slice().sort((a,b)=>new Date(b.d)-new Date(a.d)).map(rowItem).join('') || emptyRow('No partnership activity logged.')}</div>`;
  }
  if(sub==='named'){
    if(!brandHits.length) return emptyRow(`No mentions of Scalefusion, Veltar, or OneIdP found for ${v} in the selected documents.`);
    return `<div class="rowlist">${brandHits.map(i=>`
      <div class="ri" onclick='openItemModal(${JSON.stringify(i).replace(/'/g,"&#39;")})'>
        <span class="tag ${i.ty}">${TYPE_LABEL[i.ty]}</span>
        <span class="tag partnership">mentions ${i.matchedBrand}</span>
        <span class="ri-title">${i.t}</span>
        <span class="ri-date">${fmtDate(i.d)}</span>
      </div>`).join('')}</div>`;
  }
  if(sub==='valuation'){
    const valItems = vi.filter(i=>VALUATION_RE.test((i.t||'')+' '+(i.s||'')));
    return `<div class="mini-h">Financial / valuation signals found in source documents</div>
      <div class="rowlist">${valItems.map(rowItem).join('') || emptyRow('No financial data logged.')}</div>
      <div class="mnote">Figures are only what the vendor disclosed publicly in the tracked newsletters — not independently verified.</div>`;
  }
  return '';
}

async function handleFiles(fileList){
  if(!isOwner){ log('⚠ Only the dashboard owner can upload documents.'); return; }
  for(const file of Array.from(fileList)){
    await processFile(file);
  }
  renderIngest(); renderDocbar();
}
async function processFile(file){
  log(`Reading ${file.name}…`);
  try{
    let text = '';
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext==='pdf'){ text = await extractPDF(file); }
    else if(ext==='docx'){ text = await extractDOCX(file); }
    else if(ext==='xlsx'||ext==='xls'){ text = await extractXLSX(file); }
    else if(ext==='csv'){ text = await extractCSV(file); }
    else if(ext==='txt'){ text = await file.text(); }
    else { log(`⚠ ${file.name}: unsupported format for auto-extraction. Copy/paste its text into the box below instead.`); return; }

    if(!text || text.trim().length < 30){ log(`⚠ ${file.name}: couldn't extract meaningful text (may be scanned/image-based) — try the paste-text box instead.`); return; }
    log(`✓ Extracted ${text.length.toLocaleString()} characters from ${file.name}.`);
    deliverExtractedText(file.name.replace(/\.[^.]+$/,''), text);
  }catch(err){
    console.error(err);
    log(`⚠ ${file.name}: error — ${err.message}`);
  }
}
async function ingestPastedText(){
  if(!isOwner){ log('⚠ Only the dashboard owner can upload documents.'); return; }
  const text = document.getElementById('pasteText').value;
  const label = document.getElementById('pasteLabel').value || 'Pasted document';
  if(!text.trim()){ log('⚠ Paste some text first.'); return; }
  log(`✓ Captured pasted text for "${label}" (${text.length.toLocaleString()} characters).`);
  deliverExtractedText(label, text);
  document.getElementById('pasteText').value=''; document.getElementById('pasteLabel').value='';
}
/* ---- handoff: browser-side extraction is reliable; structuring happens with Claude in chat,
   not via an in-browser API call, since that call depends on hosting this app can't guarantee ---- */
let _lastExtracted = '';
function deliverExtractedText(label, text){
  _lastExtracted = text;
  const modal = document.getElementById('modalEl');
  modal.innerHTML = `
    <div class="modal-head"><h3>"${label}" — text extracted</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:13px; color:var(--slate); line-height:1.6; margin-bottom:12px;">
        Extraction happens right here in your browser and always works. Copy the text below (or download it) and paste it into your chat with Claude, asking it to structure this month's newsletter and rebuild COMP-INTEL 360 with it added — that's the reliable path, since it doesn't depend on this page calling Claude's API directly.
      </p>
      <textarea readonly style="width:100%; height:260px; font-family:var(--font-mono); font-size:11px; padding:10px; border:1px solid var(--line); border-radius:8px;" onclick="this.select()">${text.replace(/</g,'&lt;')}</textarea>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn-send" onclick="copyExtractedText()">Copy to clipboard</button>
        <button class="btn-ghost" style="border:1px solid var(--line); color:var(--ink); padding:10px 16px; border-radius:7px;" onclick="downloadExtractedText('${label.replace(/'/g,"\\'")}')">Download as .txt</button>
      </div>
    </div>
  `;
  document.getElementById('modalBg').classList.add('open');
  log(`→ "${label}" ready — copy/download it from the popup and send it to Claude in chat to get it added.`);
}
async function copyExtractedText(){
  try{ await navigator.clipboard.writeText(_lastExtracted); log('✓ Copied to clipboard.'); }
  catch(e){ log('⚠ Clipboard copy blocked by the browser — select the text manually instead.'); }
}
function downloadExtractedText(label){
  const blob = new Blob([_lastExtracted], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${label}.txt`; a.click();
  URL.revokeObjectURL(url);
}
async function extractPDF(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let text = '';
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n\n';
  }
  return text;
}
async function extractDOCX(file){
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer:buf});
  return result.value;
}
async function extractXLSX(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  let text = '';
  wb.SheetNames.forEach(name=>{
    text += `--- Sheet: ${name} ---\n`;
    text += XLSX.utils.sheet_to_csv(wb.Sheets[name]) + '\n\n';
  });
  return text;
}
async function extractCSV(file){ return await file.text(); }

  }catch(e){ /* no persisted docs yet */ }
}

/* ---- local, rule-based answers computed straight from the tracked data — no network call, always works ---- */
function localAnswer(question){
  const q = question.toLowerCase();
  const items = allItems();
  const vendors = vendorList(items);
  const matchedVendors = vendors.filter(v=>q.includes(v.toLowerCase()));
  const REGION_LIST = [...new Set(items.map(i=>i.region).filter(Boolean))];
  const matchedRegions = REGION_LIST.filter(r=>q.includes(r.toLowerCase()));

  if(matchedVendors.length>=2 && /compare|\bvs\.?\b|versus/.test(q)){
    const stat = (arr)=> `${arr.filter(i=>i.ty==='blog').length} blogs, ${arr.filter(i=>i.ty==='product').length} product updates, ${arr.filter(i=>i.ty.startsWith('event')).length} events, ${arr.filter(i=>i.partner).length} partnerships`;
    const [a,b] = matchedVendors;
    const ai = items.filter(i=>i.vendor===a), bi = items.filter(i=>i.vendor===b);
    const aCats = topEntries(ai.filter(i=>i.ty==='blog'||i.ty==='news'), i=>i.category||categorize(i.t), 2);
    const bCats = topEntries(bi.filter(i=>i.ty==='blog'||i.ty==='news'), i=>i.category||categorize(i.t), 2);
    return {text:`<strong>${a}</strong>: ${stat(ai)}${aCats.length?` — top focus: ${aCats.map(([c])=>c).join(', ')}`:''}<br><strong>${b}</strong>: ${stat(bi)}${bCats.length?` — top focus: ${bCats.map(([c])=>c).join(', ')}`:''}`, items:ai.concat(bi)};
  }
  if(/\boem\b|tech partner|integration partner/.test(q)){
    let p = items.filter(i=>i.partner && isOEM(i.partner));
    if(matchedVendors.length) p = p.filter(i=>matchedVendors.includes(i.vendor));
    if(!p.length) return {text:`No OEM/tech-partner activity found${matchedVendors.length?` for ${matchedVendors.join(', ')}`:''}.`, items:[]};
    const top = topEntries(p, i=>i.partner, 6);
    return {text:`OEM/tech partners referenced${matchedVendors.length?` by ${matchedVendors.join(', ')}`:''}: ${top.map(([n,c])=>`${n} (${c})`).join(', ')}.`, items:p};
  }
  if(/\bevent|conference|webinar|summit|trade show/.test(q)){
    let ev = items.filter(i=>i.ty.startsWith('event'));
    if(matchedRegions.length) ev = ev.filter(i=>matchedRegions.includes(i.region));
    if(matchedVendors.length) ev = ev.filter(i=>matchedVendors.includes(i.vendor));
    if(!ev.length) return {text:`No events found matching that.`, items:[]};
    return {text:`${ev.length} event${ev.length===1?'':'s'} found${matchedRegions.length?` in ${matchedRegions.join(', ')}`:''}${matchedVendors.length?` for ${matchedVendors.join(', ')}`:''}.`, items:ev};
  }
  if(/theme|focus(ing)?|topic|talking about|writing about/.test(q)){
    let bn = items.filter(i=>i.ty==='blog'||i.ty==='news');
    if(matchedVendors.length) bn = bn.filter(i=>matchedVendors.includes(i.vendor));
    const top = topEntries(bn, i=>i.category||categorize(i.t), 5);
    if(!top.length) return {text:`No blog/news content found${matchedVendors.length?` for ${matchedVendors.join(', ')}`:''}.`, items:bn};
    return {text:`Top themes${matchedVendors.length?` for ${matchedVendors.join(', ')}`:''}: ${top.map(([c,n])=>`${c} (${n})`).join(', ')}.`, items:bn};
  }
  if(/product (development|trend|update|release)|shipping|shipped/.test(q)){
    let p = items.filter(i=>i.ty==='product');
    if(matchedVendors.length) p = p.filter(i=>matchedVendors.includes(i.vendor));
    const top = topEntries(p, i=>i.category||categorize(i.t,i.s), 5);
    if(!top.length) return {text:`No product updates found${matchedVendors.length?` for ${matchedVendors.join(', ')}`:''}.`, items:p};
    return {text:`Product trends${matchedVendors.length?` for ${matchedVendors.join(', ')}`:''}: ${top.map(([c,n])=>`${c} (${n})`).join(', ')}.`, items:p};
  }
  if(/\bnews\b|award|recogni|funding|acquisition/.test(q)){
    let n = items.filter(i=>i.ty==='news');
    if(matchedVendors.length) n = n.filter(i=>matchedVendors.includes(i.vendor));
    if(!n.length) return {text:`No news items found${matchedVendors.length?` for ${matchedVendors.join(', ')}`:''}.`, items:[]};
    return {text:`${n.length} news item${n.length===1?'':'s'} found${matchedVendors.length?` for ${matchedVendors.join(', ')}`:''}.`, items:n};
  }
  if(/scalefusion|veltar|oneidp|mention(ed)? us|named us|about us|call(ed)? us out/.test(q)){
    const brandHits = findBrandMentions(items);
    if(!brandHits.length) return {text:`No mentions of Scalefusion, Veltar, or OneIdP found in the selected documents.`, items:[]};
    const byV = topEntries(brandHits, i=>i.vendor, 10);
    return {text:`${brandHits.length} mention${brandHits.length>1?'s':''} found — ${byV.map(([v,n])=>`${v} (${n})`).join(', ')}.`, items:brandHits};
  }
  if(/most active|who('|)s (the )?most active|top competitor|busiest/.test(q)){
    const qCat = categorize(q);
    let pool = items;
    if(qCat !== 'General / Other'){ pool = items.filter(i=>(i.category||categorize(i.t))===qCat); }
    const top = topEntries(pool, i=>i.vendor, 5);
    if(!top.length) return {text:`No activity found for that.`, items:[]};
    return {text:`Most active${qCat!=='General / Other'?` in ${qCat}`:''}: ${top.map(([v,n],idx)=>`${idx+1}. ${v} (${n})`).join(', ')}.`, items:[]};
  }
  if(matchedVendors.length===1){
    const v = matchedVendors[0];
    const vi = items.filter(i=>i.vendor===v);
    const cats = topEntries(vi.filter(i=>i.ty==='blog'||i.ty==='news'), i=>i.category||categorize(i.t), 3);
    return {text:`<strong>${v}</strong>: ${vi.filter(i=>i.ty==='blog').length} blogs, ${vi.filter(i=>i.ty==='product').length} product updates, ${vi.filter(i=>i.ty.startsWith('event')).length} events.${cats.length?` Top focus: ${cats.map(([c,n])=>`${c} (${n})`).join(', ')}.`:''}`, items:vi};
  }
  return null;
}

/* ============================================================
   ACCESS CONTROL — owner PIN, join requests, per-user identity
   ============================================================
   Notes on what this actually is: everything here runs client-side
   against window.storage (Claude's per-artifact key/value store).
   There is no server-side auth — a technically determined person
   could read the page source and bypass the PIN. Treat this as a
   lightweight gate for a trusted team, not a hardened access-control
   system. Cross-device sync only works when everyone opens the same
   shared Claude.ai link to this artifact — a downloaded copy of the
   file run outside Claude.ai has no storage backing at all.
   ============================================================ */
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function uuid(){ return 'u-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }

async function getMyIdentity(){
  try{
    const res = await window.storage.get('my-identity', false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return null;
}
async function setMyIdentity(identity){
  myIdentity = identity;
  try{ await window.storage.set('my-identity', JSON.stringify(identity), false); }catch(e){}
}
async function getOwnerPinHash(){
  try{ const res = await window.storage.get('owner-pin-hash', true); return res? res.value : null; }catch(e){ return null; }
}
async function getAccessRequests(){
  try{
    const res = await window.storage.get('access-requests', true);
    return res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}
async function saveAccessRequests(list){
  try{ await window.storage.set('access-requests', JSON.stringify(list), true); }catch(e){}
}
async function getMyOwnerFlag(){
  try{ const res = await window.storage.get('my-owner', false); return res && res.value==='1'; }catch(e){ return false; }
}
async function setMyOwnerFlag(v){
  try{ await window.storage.set('my-owner', v?'1':'0', false); }catch(e){}
}

/* ---- main access flow ---- */
async function resolveAccess(){
  myIdentity = await getMyIdentity();
  isOwner = await getMyOwnerFlag();
  if(isOwner) return true; // cached owner — skip gate entirely

  const ownerHash = await getOwnerPinHash();
  if(!ownerHash){
    // nobody owns this dashboard yet — first visitor claims ownership
    if(!myIdentity){ await setMyIdentity({id:uuid(), name:'Owner'}); }
    renderOwnerSetup();
    return false; // boot resumes from submitOwnerSetup()
  }

  if(!myIdentity){
    return new Promise(resolve=>{
      renderNamePrompt(async (name)=>{
        await setMyIdentity({id:uuid(), name});
        resolve(await runAccessRequestFlow());
      });
    });
  }
  return await runAccessRequestFlow();
}
async function runAccessRequestFlow(){
  const list = await getAccessRequests();
  let mine = list.find(r=>r.id===myIdentity.id);
  if(!mine){
    mine = {id:myIdentity.id, name:myIdentity.name, requestedAt:new Date().toISOString(), status:'pending'};
    list.push(mine);
    await saveAccessRequests(list);
  }
  if(mine.status==='approved'){ hideGate(); return true; }
  if(mine.status==='denied'){ renderDeniedScreen(); watchForApproval(); return false; }
  renderWaitingScreen(myIdentity.name);
  watchForApproval();
  return false;
}
async function watchForApproval(){
  const check = async ()=>{
    const list = await getAccessRequests();
    const mine = list.find(r=>r.id===myIdentity.id);
    if(mine && mine.status==='approved'){ hideGate(); clearInterval(window._approvalWatch); finishBoot(); }
    if(mine && mine.status==='denied'){ renderDeniedScreen(); }
  };
  clearInterval(window._approvalWatch);
  window._approvalWatch = setInterval(check, 6000);
}
async function approveRequest(id){
  const list = await getAccessRequests();
  const r = list.find(x=>x.id===id); if(r){ r.status='approved'; r.approvedAt=new Date().toISOString(); }
  ACCESS_REQUESTS = list;
  await saveAccessRequests(list);
  renderIngest();
}
async function denyRequest(id){
  const list = await getAccessRequests();
  const r = list.find(x=>x.id===id); if(r){ r.status='denied'; }
  ACCESS_REQUESTS = list;
  await saveAccessRequests(list);
  renderIngest();
}

/* ---- near-real-time sync loop ---- */
async function syncNow(){
  try{
    // pull in any documents uploaded by the owner since last check
    const res = await window.storage.get('uploaded-docs', true);
    if(res && res.value){
      const uploaded = JSON.parse(res.value);
      let changed = false;
      uploaded.forEach(d=>{
        if(!ALL_DOCS.find(x=>x.id===d.id)){ ALL_DOCS.push(d); changed = true; }
      });
      if(changed){
        renderDocbar();
        if(activeTab!=='ingest') renderActiveView();
        log('↻ New document synced in from the owner.');

    }
  }catch(e){ /* best effort */ }
  if(isOwner){
    ACCESS_REQUESTS = await getAccessRequests();
    renderTabNav();
    if(activeTab==='ingest') renderIngest();
  }
  lastSyncedAt = Date.now();
  updateSyncMeta();
}

  pollHandle = setInterval(syncNow, 8000);

}

async function loadMySelection(){
  try{
    const res = await window.storage.get('my-doc-selection', false);
    if(res && res.value){
      const ids = JSON.parse(res.value).filter(id=>ALL_DOCS.find(d=>d.id===id));
      if(ids.length) selectedDocIds = new Set(ids);
    }
  }catch(e){ /* keep default (all selected) */ }
}
boot();
</script>
</body>
</html>
